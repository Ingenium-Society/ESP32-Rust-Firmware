<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini-Trits</title>
<style>
  :root{--ink:#1b2547;--gold:#c0a860;--cream:#f5f0e4;--muted:#6b6a63;--line:#d8d2c0}
  *{box-sizing:border-box}
  body{margin:0;padding:18px 16px 34px;background:var(--cream);color:var(--ink);
       font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:640px;margin:0 auto}
  h1{font-size:27px;letter-spacing:-.02em;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
  .stage{border:1px solid var(--line);border-radius:10px;background:#fffdf7;padding:14px}
  #prompt{font-size:14px;color:var(--muted);margin:0 0 8px;display:none}
  #out{white-space:pre-wrap;word-wrap:break-word;font-size:15.5px;min-height:120px;
       max-height:46vh;overflow:auto}
  #out.empty{color:var(--muted);font-style:italic}
  .ask{display:flex;gap:8px;margin-top:14px}
  input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:8px;
        background:#fffdf7;color:var(--ink);font:16px/1.4 inherit}
  button{padding:12px 16px;border:0;border-radius:8px;background:var(--gold);color:#fff;
         font:600 15px/1 inherit;cursor:pointer;white-space:nowrap}
  button:disabled{opacity:.45;cursor:default}
  #status{margin-top:10px;font-size:13px;color:var(--muted)}
  .shared{margin-top:16px;font-size:12.5px;color:var(--muted);
          border-top:1px solid var(--line);padding-top:10px}
</style>
<main>
  <h1>Mini-Trits</h1>
  <p class="sub">A 5&nbsp;MB language model running on the ESP32-S3 in front of you.
     No internet, no server &mdash; this page came from the chip.</p>

  <div class="stage">
    <div id="prompt"></div>
    <div id="out" class="empty">Connecting to the board&hellip;</div>
  </div>

  <div class="ask">
    <input id="p" maxlength="120" placeholder="Start a story&hellip;" autocomplete="off">
    <button id="go">Ask</button>
  </div>
  <div id="status"></div>

  <p class="shared">Everyone connected is watching this same story, live.</p>
</main>
<script>
const p = document.getElementById('p'), go = document.getElementById('go'),
      out = document.getElementById('out'), status = document.getElementById('status'),
      promptEl = document.getElementById('prompt');

let shownId = -1, shownText = null;

function render(st) {
  if (st.id !== shownId) { shownId = st.id; shownText = null; }
  if (st.prompt) { promptEl.textContent = '\u201C' + st.prompt + '\u201D'; promptEl.style.display = 'block'; }
  else { promptEl.style.display = 'none'; }

  const t = st.text || '';
  if (t !== shownText) {
    shownText = t;
    out.textContent = t || 'Nothing playing yet \u2014 start a story below.';
    out.classList.toggle('empty', !t);
    out.scrollTop = out.scrollHeight;
  }
  go.disabled = st.generating || !p.value.trim();
  status.textContent = st.generating
    ? 'writing\u2026'
    : (t ? 'done \u2014 ask the next one' : 'waiting for someone to start a story');
}

async function tick() {
  try {
    const r = await fetch('/state', { cache: 'no-store' });
    if (!r.ok) throw new Error('bad status');
    render(await r.json());
  } catch (e) {
    status.textContent = 'lost the board \u2014 reconnecting\u2026';
  }
}

go.onclick = async () => {
  const prompt = p.value.trim();
  if (!prompt) return;
  go.disabled = true;
  status.textContent = 'sending\u2026';
  try {
    const res = await fetch('/gen', { method: 'POST', body: prompt });
    if (!res.ok) status.textContent = await res.text();
    else p.value = '';
  } catch (e) {
    status.textContent = 'could not reach the board';
  }
  tick();
};

p.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); go.click(); }
});
p.addEventListener('input', () => { go.disabled = false; });

setInterval(tick, 300);
tick();
</script>
</html>
